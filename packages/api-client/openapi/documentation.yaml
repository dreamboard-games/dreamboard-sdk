      - $ref: "#/components/parameters/SessionId"
    post: 
      summary: Add a seat to the lobby
      description: "Add a new seat to the lobby (host only, up to maxPlayers)"
      operationId: addSeat
      security: 
        - BearerAuth: 
            []
      tags: 
        - Sessions
      responses: 
        "201": 
          description: Seat added successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/SeatAssignment"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "403": 
          $ref: "#/components/responses/ForbiddenError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/sessions/{sessionId}/seats/{playerId}": 
    parameters: 
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/PlayerId"
    patch: 
      summary: Update seat settings
      description: Update seat display name and/or player color. User must be assigned to the seat.
      operationId: updateSeat
      security: 
        - BearerAuth: 
            []
      tags: 
        - Sessions
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/UpdateSeatRequest"
      responses: 
        "200": 
          description: Seat updated successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/SeatAssignment"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "403": 
          $ref: "#/components/responses/ForbiddenError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
    delete: 
      summary: Remove a seat from the lobby
      description: "Remove a seat from the lobby (host only, down to minPlayers)"
      operationId: removeSeat
      security: 
        - BearerAuth: 
            []
      tags: 
        - Sessions
      responses: 
        "204": 
          description: Seat removed successfully
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "403": 
          $ref: "#/components/responses/ForbiddenError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/sessions/{sessionId}/seats/{playerId}/assign": 
    parameters: 
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/PlayerId"
    post: 
      summary: Assign a seat to current user
      description: Assign the current authenticated user to a specific seat
      operationId: assignSeat
      security: 
        - BearerAuth: 
            []
      tags: 
        - Sessions
      responses: 
        "204": 
          description: Seat assigned successfully
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/sessions/{sessionId}/history/restore": 
    parameters: 
      - $ref: "#/components/parameters/SessionId"
    post: 
      summary: Restore game state from history
      description: Restore the game to a previous state from history (host only)
      operationId: restoreHistory
      security: 
        - BearerAuth: 
            []
      tags: 
        - Sessions
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/RestoreHistoryRequest"
      responses: 
        "200": 
          description: Game state restored successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/RestoreHistoryResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "403": 
          $ref: "#/components/responses/ForbiddenError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/sessions/{sessionId}/seats/{playerId}/unassign": 
    parameters: 
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/PlayerId"
    post: 
      summary: Unassign a seat
      description: Unassign the current user from a specific seat
      operationId: unassignSeat
      security: 
        - BearerAuth: 
            []
      tags: 
        - Sessions
      responses: 
        "204": 
          description: Seat unassigned successfully
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "403": 
          $ref: "#/components/responses/ForbiddenError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  /api/ui-bundles/fetch: 
    get: 
      summary: Fetch UI bundle
      description: Fetch and return the HTML content of a UI bundle from object storage based on the last compiled UI result
      operationId: fetchUiBundle
      security: 
        - BearerAuth: 
            []
      tags: 
        - UI Bundles
      parameters: 
        - name: gameId
          in: query
          description: ID of the game to fetch the UI bundle for (user-compiled sessions)
          schema: 
            type: string
            format: uuid
          required: false
        - name: sessionId
          in: query
          description: "When set with demo auth headers, fetch the UI bundle for that demo session's catalog revision"
          schema: 
            type: string
            format: uuid
          required: false
      responses: 
        "200": 
          description: UI bundle HTML retrieved successfully
          content: 
            text/html: 
              schema: 
                type: string
                description: HTML content of the UI bundle
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  /api/demo-games: 
    get: 
      summary: List demo games
      description: List bundled demo games that can be opened without a normal user account.
      operationId: listDemoGames
      security: 
        []
      tags: 
        - Demo Games
      responses: 
        "200": 
          description: Successfully retrieved demo games
          content: 
            application/json: 
              schema: 
                type: array
                items: 
                  $ref: "#/components/schemas/DemoGameSummary"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/demo-games/{slug}": 
    parameters: 
      - name: slug
        in: path
        required: true
        description: Demo game slug
        schema: 
          type: string
          example: frontier-trails
    get: 
      summary: Get demo game
      description: Return registration and playability metadata for a bundled demo game.
      operationId: getDemoGame
      security: 
        []
      tags: 
        - Demo Games
      responses: 
        "200": 
          description: Successfully retrieved demo game metadata
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/DemoGameDetails"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/demo-games/{slug}/thumbnail": 
    parameters: 
      - name: slug
        in: path
        required: true
        description: Demo game slug
        schema: 
          type: string
          example: frontier-trails
    get: 
      summary: Get demo game thumbnail
      description: Return the static thumbnail image for an active bundled demo game.
      operationId: getDemoGameThumbnail
      security: 
        []
      tags: 
        - Demo Games
      responses: 
        "200": 
          description: Successfully retrieved demo thumbnail
          content: 
            image/png: 
              schema: 
                type: string
                format: binary
            image/jpeg: 
              schema: 
                type: string
                format: binary
            image/webp: 
              schema: 
                type: string
                format: binary
            image/svg+xml: 
              schema: 
                type: string
                format: binary
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/demo-games/{slug}/sessions": 
    parameters: 
      - name: slug
        in: path
        required: true
        description: Demo game slug
        schema: 
          type: string
          example: frontier-trails
    post: 
      summary: Create demo session
      description: Create a fresh guest-play session for a bundled demo game.
      operationId: createDemoGameSession
      security: 
        []
      tags: 
        - Demo Games
      responses: 
        "201": 
          description: Demo session created successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/DemoSessionResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
components: 
  parameters: 
    GameId: 
      name: gameId
      in: path
      required: true
      description: Unique identifier for the game
      schema: 
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
    GameSlug: 
      name: slug
      in: path
      required: true
      description: URL-safe game slug
      schema: 
        type: string
        example: my-game
    SessionId: 
      name: sessionId
      in: path
      required: true
      description: Unique identifier for the game session
      schema: 
        type: string
        format: uuid
        example: 987e6543-e21b-34d5-b678-542316174000
    PlayerId: 
      name: playerId
      in: path
      required: true
      description: "Unique identifier for the player (e.g., 'player-1')"
      schema: 
        type: string
        example: player-1
  responses: 
    UnauthorizedError: 
      description: Unauthorized - authentication required
      content: 
        application/json: 
          schema: 
            $ref: "#/components/schemas/ProblemDetails"
    InternalServerError: 
      description: Internal server error
      content: 
        application/json: 
          schema: 
            $ref: "#/components/schemas/ProblemDetails"
    BadRequestError: 
      description: Bad request - invalid input parameters
      content: 
        application/json: 
          schema: 
            $ref: "#/components/schemas/ProblemDetails"
    NotFoundError: 
      description: Resource not found
      content: 
        application/json: 
          schema: 
            $ref: "#/components/schemas/ProblemDetails"
    ConflictError: 
      description: Conflict - version mismatch or resource state conflict
      content: 
        application/json: 
          schema: 
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequestsError: 
      description: Too many requests or live connections
      content: 
        application/json: 
          schema: 
            $ref: "#/components/schemas/ProblemDetails"
    ForbiddenError: 
      description: Forbidden - insufficient permissions
      content: 
        application/json: 
          schema: 
            $ref: "#/components/schemas/ProblemDetails"
  schemas: 
    ApiVersionResponse: 
      type: object
      description: Backend runtime version metadata used by local development hosts.
      required: 
        - backendRevision
        - uiSdkVersion
      properties: 
        backendRevision: 
          type: string
          nullable: true
          description: "Deployed backend application revision or git SHA, when available."
        uiSdkVersion: 
          type: string
          nullable: true
          description: UI SDK version expected by the backend runtime.
    CurrentAuthUserResponse: 
      type: object
      description: Backend-resolved authenticated Dreamboard user identity.
      properties: 
        id: 
          type: string
          format: uuid
          description: Dreamboard internal user UUID. Use this for ownership and session control.
        provider: 
          type: string
          description: External auth provider that authenticated the user.
        providerSubject: 
          type: string
          description: "Provider-specific subject, such as a Clerk user ID."
        email: 
          type: string
          nullable: true
          description: Verified email address when provided by the auth provider.
      required: 
        - id
        - provider
        - providerSubject
    ProblemType: 
      type: string
      description: Stable machine-readable problem identifier
      enum: 
        - urn:dreamboard:problem:action-rejected
        - urn:dreamboard:problem:active-job-conflict
        - urn:dreamboard:problem:authoring-state-base-missing
        - urn:dreamboard:problem:authoring-state-drift
        - urn:dreamboard:problem:forbidden
        - urn:dreamboard:problem:game-slug-conflict
        - urn:dreamboard:problem:internal-error
        - urn:dreamboard:problem:resource-not-found
        - urn:dreamboard:problem:source-revision-base-missing
        - urn:dreamboard:problem:source-revision-drift
        - urn:dreamboard:problem:source-revision-not-found
        - urn:dreamboard:problem:state-conflict
        - urn:dreamboard:problem:too-many-requests
        - urn:dreamboard:problem:unauthorized
        - urn:dreamboard:problem:validation-failed
      x-enum-varnames: 
        - ACTION_REJECTED
        - ACTIVE_JOB_CONFLICT
        - AUTHORING_STATE_BASE_MISSING
        - AUTHORING_STATE_DRIFT
        - FORBIDDEN
        - GAME_SLUG_CONFLICT
        - INTERNAL_ERROR
        - RESOURCE_NOT_FOUND
        - SOURCE_REVISION_BASE_MISSING
        - SOURCE_REVISION_DRIFT
        - SOURCE_REVISION_NOT_FOUND
        - STATE_CONFLICT
        - TOO_MANY_REQUESTS
        - UNAUTHORIZED
        - VALIDATION_FAILED
    ProblemViolation: 
      type: object
      properties: 
        field: 
          type: string
          description: Optional field or input path associated with the issue
        code: 
          type: string
          description: Optional machine-readable issue code
        message: 
          type: string
          description: Human-readable issue description
      required: 
        - message
    ProblemDetails: 
      type: object
      properties: 
        type: 
          $ref: "#/components/schemas/ProblemType"
        title: 
          type: string
          description: Short summary of the problem type
        status: 
          type: integer
          description: HTTP status code for this problem
        detail: 
          type: string
          description: Human-readable explanation specific to this occurrence
        instance: 
          type: string
          description: Request URI or other occurrence identifier
        requestId: 
          type: string
          description: Correlation ID for tracing this request across logs and support tooling
        retryable: 
          type: boolean
          description: Whether retrying the same request may succeed without changing input
        context: 
          type: object
          additionalProperties: 
            type: string
          description: Structured context for programmatic handling and richer UX
        violations: 
          type: array
          items: 
            $ref: "#/components/schemas/ProblemViolation"
          description: Optional structured issues associated with the problem
        timestamp: 
          type: string
          format: date-time
          description: ISO 8601 timestamp of the problem response
      required: 
        - type
        - title
        - status
        - detail
    CreateBillingCheckoutSessionRequest: 
      type: object
      properties: 
        planKey: 
          type: string
          description: Dreamboard plan key to purchase.
          default: designer
        successUrl: 
          type: string
          description: Absolute URL Stripe should redirect to after successful checkout.
        cancelUrl: 
          type: string
          description: Absolute URL Stripe should redirect to if checkout is cancelled.
    BillingSessionResponse: 
      type: object
      required: 
        - id
        - url
      properties: 
        id: 
          type: string
          description: Stripe-hosted session id.
        url: 
          type: string
          description: URL the client should navigate to.
    CreateBillingPortalSessionRequest: 
      type: object
      properties: 
        returnUrl: 
          type: string
          description: Absolute URL Stripe should return to from the billing portal.
    BillingEntitlement: 
      type: object
      required: 
        - key
        - active
        - source
      properties: 
        key: 
          type: string
        active: 
          type: boolean
        source: 
          type: string
        expiresAt: 
          type: string
          format: date-time
    CurrentBillingEntitlementsResponse: 
      type: object
      required: 
        - checkoutEnabled
        - portalEnabled
        - entitlements
      properties: 
        checkoutEnabled: 
          type: boolean
        portalEnabled: 
          type: boolean
        planKey: 
          type: string
        subscriptionStatus: 
          type: string
        currentPeriodEnd: 
          type: string
          format: date-time
        entitlements: 
          type: array
          items: 
            $ref: "#/components/schemas/BillingEntitlement"
    GameMetadata: 
      type: object
      properties: 
        minPlayers: 
          type: integer
          minimum: 1
          maximum: 20
          nullable: true
          description: Minimum player count
        maxPlayers: 
          type: integer
          minimum: 1
          maximum: 20
          nullable: true
          description: Maximum player count
        playTimeMinMinutes: 
          type: integer
          minimum: 1
          nullable: true
          description: Minimum estimated play time in minutes
        playTimeMaxMinutes: 
          type: integer
          minimum: 1
          nullable: true
          description: Maximum estimated play time in minutes
        difficulty: 
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: Complexity rating from 1 (simple) to 5 (complex)
    Game: 
      type: object
      properties: 
        id: 
          type: string
          format: uuid
          description: Unique identifier for the game
        slug: 
          type: string
          description: URL-safe game slug (lowercase kebab-case)
        name: 
          type: string
          description: Display name of the game
          minLength: 1
          maxLength: 255
        description: 
          type: string
          description: Detailed description of the game
          nullable: true
        ruleText: 
          type: string
          description: Game rules text
          nullable: true
        public: 
          type: boolean
          description: Whether the game is publicly visible
          default: false
        createdAt: 
          type: string
          format: date-time
          description: When the game was created
        updatedAt: 
          type: string
          format: date-time
          description: When the game was last updated
        scriptId: 
          type: string
          description: ID of the script that defines the game logic
          nullable: true
        previewStorageKey: 
          type: string
          description: Artifact object key for the latest generated game preview PNG
          nullable: true
        initialProjectionKey: 
          type: string
          description: Artifact object key for the reducer-native projection used to render previews
          nullable: true
        metadata: 
          $ref: "#/components/schemas/GameMetadata"
          nullable: true
        verified: 
          type: boolean
          description: Whether an agent build has passed Dreamboard workspace verification for this game
          default: false
        verifiedAt: 
          type: string
          format: date-time
          nullable: true
          description: When the latest passing agent verification was recorded
      required: 
        - id
        - slug
        - name
        - public
        - createdAt
        - updatedAt
        - verified
    CreateGameRequest: 
      type: object
      description: Request to create a new game
      properties: 
        slug: 
          type: string
          description: URL-safe game slug (lowercase kebab-case). Optional for legacy clients.
          nullable: true
        name: 
          type: string
          description: "Name of the game (default: 'Untitled Game')"
          maxLength: 200
        description: 
          type: string
          description: Optional description of the game
          maxLength: 1000
          nullable: true
        ruleText: 
          type: string
          description: Optional initial rule text
          maxLength: 50000
        enhanceRule: 
          type: boolean
          description: Whether to enhance the rules using AI before saving
          default: false
    ExtractGameSpecRequest: 
      type: object
      description: Request to extract a structured game spec from rule text.
      properties: 
        ruleText: 
          type: string
          minLength: 1
          maxLength: 50000
      required: 
        - ruleText
    GameSpecPlayers: 
      type: object
      description: Supported player count range for a generated game.
      properties: 
        min: 
          type: integer
          minimum: 1
          maximum: 20
        max: 
          type: integer
          minimum: 1
          maximum: 20
      required: 
        - min
        - max
    GameSpecComponent: 
      type: string
      description: Component family expected in the generated game.
      enum: 
        - deck
        - dice
        - board
        - resource
        - token
        - tracker
    GameSpecComponentItem: 
      type: object
      description: "A named child entry within a component, such as a card in a deck, a\nregion on a board, a space on a track, or a type in a tile set.\n"
      properties: 
        name: 
          type: string
          minLength: 1
          maxLength: 100
        notes: 
          type: string
          maxLength: 500
      required: 
        - name
    GameSpecComponentSpec: 
      type: object
      description: "A single component instance in the generated game. Multiple instances of\nthe same `kind` are allowed (e.g. two decks). `name` is a short label and\n`notes` is freeform detail the agent will expand into manifest entries.\n`items` can carry named child entries when the component naturally contains\nthem.\n"
      properties: 
        kind: 
          $ref: "#/components/schemas/GameSpecComponent"
        name: 
          type: string
          minLength: 1
          maxLength: 100
        notes: 
          type: string
          maxLength: 500
        items: 
          type: array
          maxItems: 100
          items: 
            $ref: "#/components/schemas/GameSpecComponentItem"
      required: 
        - kind
        - name
    GameSpecForm: 
      type: object
      description: Structured game specification submitted by the new-game flow.
      properties: 
        name: 
          type: string
          minLength: 1
          maxLength: 200
        players: 
          $ref: "#/components/schemas/GameSpecPlayers"
        components: 
          type: array
          items: 
            $ref: "#/components/schemas/GameSpecComponentSpec"
          maxItems: 50
        winCondition: 
          type: string
          maxLength: 2000
        additionalRules: 
          type: string
          minLength: 1
          maxLength: 50000
      required: 
        - name
        - players
        - components
        - winCondition
        - additionalRules
    ExtractGameSpecResponse: 
      type: object
      description: Structured game spec extracted from rule text.
      properties: 
        gameSpec: 
          $ref: "#/components/schemas/GameSpecForm"
      required: 
        - gameSpec
    PlayersDefinition: 
      type: object
      description: Supported player-count metadata for the game
      properties: 
        minPlayers: 
          type: integer
          format: int32
          minimum: 1
          maximum: 10
        maxPlayers: 
          type: integer
          format: int32
          minimum: 1
          maximum: 10
        optimalPlayers: 
          type: integer
          format: int32
          minimum: 1
          maximum: 10
      required: 
        - minPlayers
        - maxPlayers
    PresetCardSetDefinition: 
      type: object
      properties: 
        id: 
          type: string
          description: Unique local identifier for the authored card set
          minLength: 1
        presetId: 
          type: string
          description: Built-in preset card-set selector
          minLength: 1
        name: 
          type: string
          description: Display name of the card set
          minLength: 1
        type: 
          type: string
          enum: 
            - preset
          description: Type of card set source
      required: 
        - id
        - presetId
        - name
        - type
    JsonValue: 
      description: Arbitrary authored JSON value.
      oneOf: 
        - type: string
        - type: integer
        - type: number
        - type: boolean
        - type: "null"
        - type: array
          items: 
            $ref: "#/components/schemas/JsonValue"
        - type: object
          additionalProperties: 
            $ref: "#/components/schemas/JsonValue"
    PropertySchema: 
      type: object
      properties: 
        type: 
          type: string
          enum: 
            - string
            - integer
            - number
            - boolean
            - zoneId
            - cardId
            - playerId
            - boardId
            - edgeId
            - vertexId
            - spaceId
            - pieceId
            - dieId
            - resourceId
            - array
            - object
            - record
            - enum
          description: The data type of the property.
        description: 
          type: string
          description: "Optional description of the property's purpose and usage."
          nullable: true
        optional: 
          type: boolean
          description: Whether an object property may be omitted.
          default: false
        nullable: 
          type: boolean
          description: Whether the value may be null.
          default: false
        default: 
          description: "Optional authored default value for this property. When present, omitted\nseed values materialize to the default and generated TypeScript treats\nthe property as present even if `optional: true` is also set.\n"
          $ref: "#/components/schemas/JsonValue"
          x-kotlin-type: kotlinx.serialization.json.JsonElement
          nullable: true
        items: 
          $ref: "#/components/schemas/PropertySchema"
          description: "For array types, the schema of the array items. Required if type is 'array'."
          nullable: true
        properties: 
          type: object
          additionalProperties: 
            $ref: "#/components/schemas/PropertySchema"
          description: "For object types, the schema of the object's properties. Required if type is 'object'."
          nullable: true
        enums: 
          type: array
          items: 
            type: string
          description: "For enum types, the list of allowed string values. Required if type is 'enum'."
          nullable: true
        values: 
          $ref: "#/components/schemas/PropertySchema"
          description: "For record types, the schema of the record's values. Required if type is 'record'."
          nullable: true
      required: 
        - type
    ObjectSchema: 
      type: object
      properties: 
        properties: 
          type: object
          additionalProperties: 
            $ref: "#/components/schemas/PropertySchema"
