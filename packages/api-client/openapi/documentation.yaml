    DemoGameDetails: 
      allOf: 
        - $ref: "#/components/schemas/DemoGameSummary"
        - type: object
          properties: 
            activeRevisionId: 
              type: string
              format: uuid
              nullable: true
              description: Active immutable catalog revision when registered.
            bundleFingerprint: 
              type: string
              nullable: true
            error: 
              type: string
              nullable: true
    DemoSessionResponse: 
      type: object
      description: Guest-play session created for a public demo game.
      required: 
        - sessionId
        - shortCode
        - demoActorSessionId
        - guestSessionSecret
        - seed
        - gameSource
      properties: 
        sessionId: 
          type: string
          format: uuid
          description: game_sessions.session_id
        shortCode: 
          type: string
        demoActorSessionId: 
          type: string
          format: uuid
          description: demo_sessions.id; send with demo session secret headers to authorize as DemoGuest.
        guestSessionSecret: 
          type: string
          description: Per-session secret; send with demo headers (hashed server-side).
        seed: 
          type: integer
          format: int64
        selectedPlayerId: 
          type: string
          nullable: true
        gameSource: 
          $ref: "#/components/schemas/SessionGameSource"
    HistoryUpdatedEvent: 
      type: object
      required: 
        - type
        - history
      properties: 
        type: 
          type: string
          enum: 
            - history.updated
        history: 
          $ref: "#/components/schemas/SessionSnapshotHistory"
    ParameterType: 
      type: string
      enum: 
        - cardId
        - cardType
        - playerId
        - string
        - number
        - boolean
        - zoneId
        - pieceId
        - dieId
        - boardId
        - edgeId
        - vertexId
        - spaceId
        - resourceId
      description: Type of parameter accepted by a runtime action
    ActionParameterDefinition: 
      type: object
      description: Defines a parameter for an action
      required: 
        - name
        - type
      properties: 
        name: 
          type: string
        type: 
          $ref: "#/components/schemas/ParameterType"
        required: 
          type: boolean
          default: true
        array: 
          type: boolean
          default: false
        minLength: 
          type: integer
          minimum: 0
          nullable: true
        maxLength: 
          type: integer
          minimum: 0
          nullable: true
        cardSetId: 
          type: string
          nullable: true
          description: Optional card set ID to specify which card set a CARD_ID parameter refers to
        description: 
          type: string
          nullable: true
    ActionDefinition: 
      type: object
      description: Defines an available player action with metadata and parameter definitions
      required: 
        - actionType
        - displayName
        - parameters
      properties: 
        actionType: 
          type: string
          description: Unique action identifier
        displayName: 
          type: string
          description: UI display name for this action
        description: 
          type: string
          nullable: true
          description: Optional help text describing the action
        parameters: 
          type: array
          items: 
            $ref: "#/components/schemas/ActionParameterDefinition"
          description: List of parameters this action accepts
        errorCodes: 
          type: array
          items: 
            type: string
          description: List of possible validation error codes
          nullable: true
    CardSetSourceType: 
      type: string
      enum: 
        - preset
        - csv
        - manual
      description: Type of source for the card set
    BoardLayout: 
      type: string
      enum: 
        - generic
        - hex
        - square
      description: Engine-level structural board layout discriminator
    GameManifestResponse: 
      type: object
      properties: 
        manifestId: 
          type: string
          format: uuid
          description: Unique identifier for this manifest version
        gameId: 
          type: string
          format: uuid
          description: Game identifier
        userId: 
          type: string
          format: uuid
          description: User who created this version
        jobId: 
          type: string
          format: uuid
          description: Agent job that created this manifest
          nullable: true
        manifest: 
          $ref: "#/components/schemas/GameTopologyManifest"
          description: The board manifest data
        version: 
          type: integer
          description: Version number for this game
        createdAt: 
          type: string
          format: date-time
          description: When this version was created
      required: 
        - manifestId
        - gameId
        - userId
        - manifest
        - version
        - createdAt
  securitySchemes: 
    BearerAuth: 
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication