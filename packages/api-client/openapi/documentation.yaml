openapi: 3.1.0
info: 
  title: Dreamboard API
  description: API for managing board games and game sessions in Dreamboard
  version: 1.0.0
  contact: 
    name: Dreamboard Team
servers: 
  - url: https://dreamboard.games
    description: Production server
  - url: http://localhost:8080
    description: Development server
security: 
  - BearerAuth: 
      []
tags: 
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication and CLI session operations
  - name: Billing
    description: "Billing checkout, subscription management, and entitlements"
  - name: Games
    description: Game management operations
  - name: Rulebooks
    description: Rulebook query operations
  - name: Sessions
    description: Game session and lobby management
  - name: UI Bundles
    description: UI bundle fetching and management
  - name: Agent
    description: AI agent operations
  - name: WebSocket
    description: Real-time communication
  - name: Webhooks
    description: Webhook endpoints called by external services
  - name: Development
    description: Development and testing endpoints
  - name: Demo Games
    description: Bundled catalog demos playable without an account
paths: 
  /: 
    get: 
      summary: Health check endpoint
      description: Returns a simple health check message
      operationId: healthCheck
      security: 
        []
      tags: 
        - Health
      responses: 
        "200": 
          description: Service is healthy
          content: 
            text/plain: 
              schema: 
                type: string
                example: Hello World!
  /api/version: 
    get: 
      summary: Get backend version metadata
      description: Returns backend revision metadata and the UI SDK version expected by the backend runtime.
      operationId: getApiVersion
      security: 
        []
      tags: 
        - Health
      responses: 
        "200": 
          description: Successfully retrieved backend version metadata
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/ApiVersionResponse"
  /api/auth/me: 
    get: 
      summary: Get the authenticated Dreamboard user identity
      description: "Returns the backend-resolved Dreamboard internal user identity for the\ncurrent bearer token. Provider-specific subjects such as Clerk user IDs\nare exposed only as metadata; clients should use `id` for Dreamboard\nownership and session control.\n"
      operationId: getCurrentAuthUser
      tags: 
        - Auth
      responses: 
        "200": 
          description: Current authenticated user identity
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/CurrentAuthUserResponse"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  /api/billing/checkout-sessions: 
    post: 
      summary: Create a Stripe Checkout Session
      description: "Creates a Stripe-hosted subscription checkout session for the current\nauthenticated Dreamboard user. Dreamboard resolves billing ownership\nthrough the internal user id, not through Clerk or Stripe ids.\n"
      operationId: createBillingCheckoutSession
      tags: 
        - Billing
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateBillingCheckoutSessionRequest"
      responses: 
        "200": 
          description: Checkout session created successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/BillingSessionResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  /api/billing/portal-sessions: 
    post: 
      summary: Create a Stripe Customer Portal Session
      description: "Creates a Stripe-hosted billing portal session for the current\nauthenticated Dreamboard user.\n"
      operationId: createBillingPortalSession
      tags: 
        - Billing
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateBillingPortalSessionRequest"
      responses: 
        "200": 
          description: Billing portal session created successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/BillingSessionResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  /api/billing/entitlements: 
    get: 
      summary: Get current user entitlements
      description: Returns backend-owned entitlement state for the current authenticated user.
      operationId: getCurrentBillingEntitlements
      tags: 
        - Billing
      responses: 
        "200": 
          description: Current billing and entitlement state
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/CurrentBillingEntitlementsResponse"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  /api/webhooks/stripe: 
    post: 
      summary: Receive Stripe billing webhook events
      description: "Receives Stripe webhook events. The handler verifies the Stripe signature\nagainst the raw request body before updating backend-owned billing and\nentitlement state.\n"
      operationId: receiveStripeBillingWebhook
      security: 
        []
      tags: 
        - Webhooks
        - Billing
      responses: 
        "204": 
          description: Stripe event accepted or already processed
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  /api/games: 
    get: 
      summary: "List user's games"
      description: Retrieve a list of all games owned by the authenticated user
      operationId: listGames
      tags: 
        - Games
      responses: 
        "200": 
          description: Successfully retrieved games list
          content: 
            application/json: 
              schema: 
                type: array
                items: 
                  $ref: "#/components/schemas/Game"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
    post: 
      summary: Create a new game
      description: Create a new game definition
      operationId: createGame
      tags: 
        - Games
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateGameRequest"
      responses: 
        "201": 
          description: Game created successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Game"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "409": 
          $ref: "#/components/responses/ConflictError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  /api/games/extract-spec: 
    post: 
      summary: Extract a structured game spec
      description: Extract a normalized structured game spec from pasted rule text.
      operationId: extractGameSpec
      security: 
        - {}
        - BearerAuth: 
            []
      tags: 
        - Agent
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/ExtractGameSpecRequest"
      responses: 
        "200": 
          description: Structured game spec extracted
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/ExtractGameSpecResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "429": 
          $ref: "#/components/responses/TooManyRequestsError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
        "503": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}": 
    parameters: 
      - $ref: "#/components/parameters/GameId"
    get: 
      summary: Get game by ID
      description: Retrieve a specific game definition by its ID
      operationId: getGame
      tags: 
        - Games
      responses: 
        "200": 
          description: Successfully retrieved game
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Game"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
    put: 
      summary: Update game
      description: Update an existing game definition
      operationId: updateGame
      tags: 
        - Games
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/UpdateGameRequest"
      responses: 
        "200": 
          description: Game updated successfully
          content: 
            application/json: 
              schema: 
                type: string
                description: Success message
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
    delete: 
      summary: Delete game
      description: Delete a game definition permanently
      operationId: deleteGame
      tags: 
        - Games
      responses: 
        "200": 
          description: Game deleted successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/DeleteGameResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/slug/{slug}": 
    parameters: 
      - $ref: "#/components/parameters/GameSlug"
    get: 
      summary: Get game by slug
      description: Retrieve a specific game definition by its slug
      operationId: getGameBySlug
      tags: 
        - Games
      parameters: 
        - name: includeDeleted
          in: query
          description: Include soft-deleted games in the lookup. Defaults to false.
          schema: 
            type: boolean
            default: false
          required: false
      responses: 
        "200": 
          description: Successfully retrieved game
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Game"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  /api/workshop/query: 
    get: 
      summary: Query rulebook text by title
      description: "Search ranked rulebook candidates for the provided title, try up to the top 3 matches, and return extracted text from the first valid PDF found."
      operationId: queryWorkshopRulebook
      security: 
        - BearerAuth: 
            []
      tags: 
        - Rulebooks
      parameters: 
        - name: title
          in: query
          description: Board game title to search for in the rulebook library.
          required: true
          schema: 
            type: string
            minLength: 1
      responses: 
        "200": 
          description: Extracted rulebook text for the first valid candidate.
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/WorkshopRuleTextResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/manifests": 
    post: 
      summary: Save game manifest
      description: Create a new versioned manifest for a game. Each save creates a new version with automatic version numbering.
      operationId: saveManifest
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/SaveManifestRequest"
      responses: 
        "201": 
          description: Manifest saved successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/SaveManifestResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
    get: 
      summary: Find manifests for game
      description: "Retrieve a list of manifest versions for a game, ordered by version descending (newest first)"
      operationId: findManifests
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
        - name: limit
          in: query
          description: "Maximum number of manifests to return (default: 10, max: 100)"
          schema: 
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
          required: false
        - name: ruleId
          in: query
          description: Filter to only return manifests for a specific rule
          schema: 
            type: string
            format: uuid
          required: true
      responses: 
        "200": 
          description: Manifests retrieved successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/FindManifestsResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/manifests/{manifestId}": 
    parameters: 
      - name: manifestId
        in: path
        required: true
        description: Unique identifier for the manifest
        schema: 
          type: string
          format: uuid
    get: 
      summary: Get manifest by ID
      description: Retrieve a specific manifest version by its ID with full board manifest details
      operationId: getManifest
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      responses: 
        "200": 
          description: Manifest retrieved successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/GameManifestDto"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/compiled-results/latest": 
    get: 
      summary: Get latest compiled result for a game
      description: Return the most recent compiled result for the specified game.
      operationId: getLatestCompiledResult
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
        - name: successOnly
          in: query
          description: "If true, only return results where success=true and uiStorageKey is present"
          schema: 
            type: boolean
            default: false
          required: false
      responses: 
        "200": 
          description: Latest compiled result found
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/CompiledResult"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/compiled-results": 
    get: 
      summary: List compiled results for a game
      description: "Retrieve a list of compiled results for a game, ordered by creation date descending (newest first). Includes both successful and failed compilations."
      operationId: listCompiledResults
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return. Default is 10.
          schema: 
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: authoringStateId
          in: query
          required: false
          description: Optional authoring state ID to limit results to a single authored head.
          schema: 
            type: string
            format: uuid
      responses: 
        "200": 
          description: Compiled results retrieved successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/ListCompiledResultsResponse"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
    post: 
      summary: Queue a compile job for an authoring state
      description: "Queue an asynchronous compile for a specific authoring state. Poll `/api/jobs/{jobId}` and fetch the final compiled result by ID when the job completes."
      operationId: queueCompiledResultJob
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/QueueCompiledResultJobRequest"
      responses: 
        "202": 
          description: Compile job accepted
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/QueueCompiledResultJobResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/preview/initial-projection": 
    put: 
      summary: Upload initial projection for preview rendering
      description: Store the reducer-native projection JSON used by the compiler service to render a dashboard preview screenshot.
      operationId: uploadInitialProjection
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/UploadInitialProjectionRequest"
      responses: 
        "204": 
          description: Initial projection uploaded successfully
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/preview/screenshot": 
    post: 
      summary: Queue preview screenshot generation
      description: Queue an async job that renders the latest successful UI bundle with the stored initial projection and stores a PNG preview.
      operationId: queuePreviewScreenshot
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
      responses: 
        "202": 
          description: Preview screenshot job queued
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/PreviewScreenshotJobResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "409": 
          $ref: "#/components/responses/ConflictError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/preview/image": 
    get: 
      summary: Fetch generated preview image
      description: Return the latest generated game preview PNG from artifact storage.
      operationId: fetchPreviewImage
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
      responses: 
        "200": 
          description: Preview image retrieved successfully
          content: 
            image/png: 
              schema: 
                type: string
                format: binary
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/dev-compiles/ensure": 
    post: 
      summary: Ensure a private dev compile exists
      description: Reuse or create a session-scoped dev compilation for the provided workspace fingerprint without advancing the canonical authored head.
      operationId: ensureDevCompile
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/EnsureDevCompileRequest"
      responses: 
        "200": 
          description: Existing dev compile reused or cache miss reported
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/EnsureDevCompileResponse"
        "202": 
          description: Dev compile job accepted
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/EnsureDevCompileResponse"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "409": 
          $ref: "#/components/responses/ConflictError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/compiled-results/{compiledResultId}": 
    parameters: 
      - $ref: "#/components/parameters/GameId"
      - name: compiledResultId
        in: path
        required: true
        description: Unique identifier for the compiled result
        schema: 
          type: string
          format: uuid
    get: 
      summary: Get compiled result by ID
      description: "Fetch a specific compiled result for a game, including failed results and diagnostics."
      operationId: getCompiledResult
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      responses: 
        "200": 
          description: Compiled result found
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/CompiledResult"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/download": 
    get: 
      summary: Download authored game source files
      description: Download the authored source files for the current authoring head as a ZIP archive.
      operationId: downloadGameSources
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
      responses: 
        "200": 
          description: ZIP archive containing source files
          content: 
            application/zip: 
              schema: 
                type: string
                format: binary
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/sources": 
    get: 
      summary: Get authored game source files
      description: "Retrieve authored source files as JSON for the selected authoring state. If no authoring state is provided, the current authoring head is used."
      operationId: getGameSources
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
        - name: authoringStateId
          in: query
          required: false
          description: "Optional authoring state ID to fetch sources from. If not provided, uses the current authoring head."
          schema: 
            type: string
            format: uuid
      responses: 
        "200": 
          description: Source files retrieved successfully
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/GameSourcesResponse"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "404": 
          $ref: "#/components/responses/NotFoundError"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/source-revisions": 
    post: 
      summary: Create a source revision for a game
      description: Create a new authored source revision from a hash-addressed change set. The request must be based on the current head revision for the game.
      operationId: createSourceRevision
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateSourceRevisionRequest"
      responses: 
        "201": 
          description: Source revision created
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/SourceRevision"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
          $ref: "#/components/responses/UnauthorizedError"
        "409": 
          description: Base source revision does not match the current head revision
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/ProblemDetails"
        "500": 
          $ref: "#/components/responses/InternalServerError"
  "/api/games/{gameId}/source-blobs/upload-sessions": 
    post: 
      summary: Create direct-upload targets for source blobs
      description: Create a direct-upload session for one or more source blobs referenced by a forthcoming source revision.
      operationId: createSourceBlobUploadSession
      security: 
        - BearerAuth: 
            []
      tags: 
        - Games
      parameters: 
        - $ref: "#/components/parameters/GameId"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/CreateSourceBlobUploadSessionRequest"
      responses: 
        "201": 
          description: Upload session created
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/SourceBlobUploadSession"
        "400": 
          $ref: "#/components/responses/BadRequestError"
        "401": 
