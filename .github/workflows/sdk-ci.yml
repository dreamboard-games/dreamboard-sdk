name: sdk-ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  standalone-starter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Bootstrap exact source with Giget
        env:
          TEMPLATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          TEMPLATE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx giget@3.3.1 "gh:$TEMPLATE_REPOSITORY/templates/game#$TEMPLATE_REF" "$RUNNER_TEMP/dreamboard-game"
      - name: Verify published-package starter
        working-directory: ${{ runner.temp }}/dreamboard-game
        run: |
          pnpm install
          pnpm check
          pnpm build
