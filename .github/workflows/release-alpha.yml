name: release-alpha

on:
  workflow_dispatch:

concurrency:
  group: release-alpha-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dreamboard-sdk
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: dreamboard-sdk
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dreamboard-sdk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Reject an immutable version that already exists
        run: |
          SDK_VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          SDK_NAME="$(node -p "require('./packages/sdk/package.json').name")"
          if npm view "$SDK_NAME@$SDK_VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$SDK_NAME@$SDK_VERSION already exists; choose the planned next version." >&2
            exit 1
          fi
      - run: pnpm --dir packages/ui-workbench exec playwright install --with-deps chromium webkit
      - name: Create and verify the release candidate
        run: pnpm verify:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-release-proof
          path: dreamboard-sdk/build/proofs/release/current/**
      - name: Validate alpha package metadata
        run: |
          SDK_VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          SDK_NAME="$(node -p "require('./packages/sdk/package.json').name")"
          case "$SDK_VERSION" in
            *-alpha.*) ;;
            *) echo "Version is not an alpha prerelease: $SDK_VERSION" >&2; exit 1 ;;
          esac
          test "$SDK_NAME" = "@dreamboard-games/sdk"
          CANDIDATE_RECEIPT="build/proofs/release/current/candidate/receipt.json"
          CANDIDATE_INTEGRITY="$(node -p "JSON.parse(require('fs').readFileSync('$CANDIDATE_RECEIPT', 'utf8')).package.integrity")"
          test -n "$CANDIDATE_INTEGRITY"
          printf '{"name":"%s","version":"%s","distTag":"alpha","integrity":"%s"}\n' "$SDK_NAME" "$SDK_VERSION" "$CANDIDATE_INTEGRITY" > "$RUNNER_TEMP/sdk-package-metadata.json"
      - name: Stage verified SDK tarball
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          cp build/proofs/release/current/candidate/*.tgz "$RUNNER_TEMP/package/"
          cp build/proofs/release/current/candidate/receipt.json "$RUNNER_TEMP/package/candidate-receipt.json"
          test "$(find "$RUNNER_TEMP/package" -name '*.tgz' | wc -l | tr -d ' ')" = "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-package
          path: |
            ${{ runner.temp }}/package/*.tgz
            ${{ runner.temp }}/package/candidate-receipt.json
            ${{ runner.temp }}/sdk-package-metadata.json

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-alpha
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-package
          path: package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish verified alpha SDK package
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const metadata = JSON.parse(fs.readFileSync("package/sdk-package-metadata.json", "utf8"));
          if (metadata.name !== "@dreamboard-games/sdk") throw new Error(`Unexpected package name: ${metadata.name}`);
          if (!metadata.version.includes("-alpha.")) throw new Error(`Version is not alpha: ${metadata.version}`);
          if (metadata.distTag !== "alpha") throw new Error(`Unexpected dist-tag: ${metadata.distTag}`);
          const candidate = JSON.parse(fs.readFileSync("package/package/candidate-receipt.json", "utf8"));
          if (candidate.package?.integrity !== metadata.integrity) throw new Error("Candidate receipt integrity does not match release metadata");
          const tarball = fs.readdirSync("package").find((entry) => entry.endsWith(".tgz"));
          const actual = `sha512-${require("node:crypto").createHash("sha512").update(fs.readFileSync(`package/${tarball}`)).digest("base64")}`;
          if (actual !== metadata.integrity) throw new Error("Uploaded tarball integrity does not match the verified candidate");
          NODE
          test "$(find package -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          sdk_tarball="$(find package -name '*.tgz' -print -quit)"
          npm publish "$sdk_tarball" --tag alpha --provenance
          EXPECTED_INTEGRITY="$(node -p "JSON.parse(require('fs').readFileSync('package/sdk-package-metadata.json', 'utf8')).integrity")"
          SDK_NAME="$(node -p "JSON.parse(require('fs').readFileSync('package/sdk-package-metadata.json', 'utf8')).name")"
          SDK_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package/sdk-package-metadata.json', 'utf8')).version")"
          PUBLISHED_INTEGRITY="$(npm view "$SDK_NAME@$SDK_VERSION" dist.integrity --registry=https://registry.npmjs.org/)"
          test "$PUBLISHED_INTEGRITY" = "$EXPECTED_INTEGRITY"
