name: release-alpha

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-alpha
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm publication:check
      - run: pnpm version:check
      - run: pnpm peer-hygiene:check
      - run: pnpm --filter @dreamboard-games/reducer-contract generate:check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm pack:dry-run
      - name: Publish alpha SDK package
        run: pnpm --filter @dreamboard-games/sdk publish --access public --tag alpha --provenance --no-git-checks
