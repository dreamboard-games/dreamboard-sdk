name: release-alpha

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Validate alpha package metadata
        run: |
          SDK_VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          SDK_NAME="$(node -p "require('./packages/sdk/package.json').name")"
          case "$SDK_VERSION" in
            *-alpha.*) ;;
            *) echo "Version is not an alpha prerelease: $SDK_VERSION" >&2; exit 1 ;;
          esac
          test "$SDK_NAME" = "@dreamboard-games/sdk"
          printf '{"name":"%s","version":"%s","distTag":"alpha"}\n' "$SDK_NAME" "$SDK_VERSION" > "$RUNNER_TEMP/sdk-package-metadata.json"
      - name: Pack verified SDK tarball
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm --filter @dreamboard-games/sdk pack --pack-destination "$RUNNER_TEMP/package"
          test "$(find "$RUNNER_TEMP/package" -name '*.tgz' | wc -l | tr -d ' ')" = "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-package
          path: |
            ${{ runner.temp }}/package/*.tgz
            ${{ runner.temp }}/sdk-package-metadata.json

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-alpha
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-package
          path: package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish verified alpha SDK package
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const metadata = JSON.parse(fs.readFileSync("package/sdk-package-metadata.json", "utf8"));
          if (metadata.name !== "@dreamboard-games/sdk") throw new Error(`Unexpected package name: ${metadata.name}`);
          if (!metadata.version.includes("-alpha.")) throw new Error(`Version is not alpha: ${metadata.version}`);
          if (metadata.distTag !== "alpha") throw new Error(`Unexpected dist-tag: ${metadata.distTag}`);
          NODE
          test "$(find package -name '*.tgz' | wc -l | tr -d ' ')" = "1"
          npm publish package/*.tgz --tag alpha --provenance
