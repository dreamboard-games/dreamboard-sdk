name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify immutable candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}
    steps:
      - name: Require the default branch
        run: |
          test "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" || {
            echo "Release must run from ${{ github.event.repository.default_branch }}." >&2
            exit 1
          }

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.4.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create and verify candidate
        run: pnpm release:verify

      - name: Require unpublished version
        run: node scripts/release.ts registry --expect unpublished

      - name: Read derived release metadata
        id: metadata
        run: |
          metadata="$(node scripts/release.ts metadata)"
          release_tag="$(jq -r .gitTag <<<"$metadata")"
          npm_tag="$(jq -r .npmTag <<<"$metadata")"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $release_tag already exists." >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: build/release/candidate/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified candidate
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: build/release/candidate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Revalidate candidate and resumable registry state
        run: node scripts/release.ts registry --expect publishable

      - name: Publish SDK
        run: |
          set -euo pipefail
          candidate="build/release/candidate/candidate.json"
          name="$(jq -r '.package.name' "$candidate")"
          version="$(jq -r '.package.version' "$candidate")"
          file="$(jq -r '.package.file' "$candidate")"
          expected_integrity="$(jq -r '.package.integrity' "$candidate")"
          published_integrity="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
          if [ -n "$published_integrity" ]; then
            test "$published_integrity" = "$expected_integrity" || {
              echo "$name@$version exists with different integrity." >&2
              exit 1
            }
            echo "Verified existing $name@$version from this workflow candidate."
          else
            npm publish "build/release/candidate/$file" \
              --access public \
              --tag "${{ needs.verify.outputs.npm_tag }}" \
              --provenance
          fi

      - name: Verify registry convergence
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/release.ts registry --expect published; then
              exit 0
            fi
            test "$attempt" != 6 || exit 1
            sleep 10
          done

      - name: Create GitHub release
        run: |
          tag="${{ needs.verify.outputs.release_tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists from this workflow run."
            exit 0
          fi
          args=("$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes)
          if [ "${{ needs.verify.outputs.npm_tag }}" != latest ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" build/release/candidate/*.tgz build/release/candidate/candidate.json
        env:
          GH_TOKEN: ${{ github.token }}
